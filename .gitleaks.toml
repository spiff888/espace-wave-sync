# gitleaks config: default secret rules plus site-data rules for this repo.
# Run: gitleaks detect --config .gitleaks.toml (history) or gitleaks protect --staged
[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private (RFC 1918) IPv4 address: likely real site data"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
tags = ["site-data"]

[[rules]]
id = "bearer-token"
description = "Hardcoded bearer token"
regex = '''(?i)bearer\s+[a-z0-9._\-]{20,}'''
tags = ["secret"]

[allowlist]
description = "Example and doc placeholders"
paths = ['''\.gitleaks\.toml''']
regexes = ['''00000000-0000-0000-0000-[0-9a-f]{12}''']
